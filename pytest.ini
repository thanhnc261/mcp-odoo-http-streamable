"""Pytest configuration file"""

# Test configuration
collect_ignore = ["scripts/"]

# Pytest markers
markers = [
    "integration: Integration tests",
    "e2e: End-to-end tests requiring real Odoo instance",
    "performance: Performance tests", 
    "security: Security tests",
]

# Test discovery
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage configuration
addopts = [
    "--cov=src/odoo_mcp",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v"
]

# Async configuration
asyncio_mode = "auto"
